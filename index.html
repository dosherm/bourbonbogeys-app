<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#004729">
  <title>B&amp;B Golf</title>
  <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
  <style>
    :root { --green: #004729; --ink: #1d1d1f; --muted: #5f6368; --bg: #f6f7f5; --card: #fff; --line: #e2e5e1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f2; --muted: #a8ada9; --bg: #121513; --card: #1c201d; --line: #2c322e; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 480px; margin: 0 auto; padding: 56px 16px 40px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 1.9rem; margin: 18px 0 6px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
    a.btn { display: block; padding: 15px; border-radius: 14px; font-weight: 700; text-decoration: none; margin-bottom: 12px; font-size: 1.05rem; }
    a.primary { background: var(--green); color: #fff; }
    a.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    small { display: block; margin-top: 24px; color: var(--muted); font-size: .85rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/app/icons/apple-touch-icon.png" alt="">
    <h1>B&amp;B Golf</h1>
    <p>Scores, games and payouts for Bourbon &amp; Bogeys golf trips.</p>
    <a class="btn primary" href="/app/">Open the app</a>
    <a class="btn secondary" href="/guide/">How to use the app</a>
    <small>On iPhone, get <b>B&amp;B Golf</b> from the App Store link Dan sends you.<br>On Android, open the app here in Chrome and choose <b>Add to Home screen</b>.</small>
  </main>
</body>
</html>
